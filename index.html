<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Levi喵喵日记</title>
<style>
/* ═══════ 变量 ═══════ */
:root{
  --bg:#f2f2f7;--bg2:#e5e5ea;--card:rgba(255,255,255,.92);--card-s:#fff;
  --pri:#7cb8df;--pri-l:#bad8f0;--pri-d:#5a9ac5;
  --acc:#efaabd;--acc-l:#f6d0de;
  --txt:#1c1c1e;--txt2:#8e8e93;--txt3:#aeaeb2;
  --bdr:rgba(60,60,67,.08);--shd:rgba(0,0,0,.04);
  --bub-me:linear-gradient(135deg,#bad8f0,#d0e8fa);--bub-ta:#fff;
  --r-s:10px;--r-m:14px;--r-l:20px;--r-xl:26px;
  --ff:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  --mono:'SF Mono','Fira Code',monospace;
  --ease:cubic-bezier(.4,0,.2,1);--bounce:cubic-bezier(.34,1.56,.64,1);
  --safe-t:env(safe-area-inset-top,20px);--safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--ff);background:#000;color:var(--txt);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:inherit;font-size:inherit}button{cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:0;display:none}

/* ═══════ 灵动岛状态栏（仿iPhone） ═══════ */
.status-bar{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:54px;padding-top:var(--safe-t);
  font-size:14px;font-weight:600;flex-shrink:0;z-index:200;
}
.status-bar .time{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.status-bar .notch{
  position:absolute;top:var(--safe-t);left:50%;transform:translateX(-50%);
  width:126px;height:36px;background:#000;border-radius:0 0 20px 20px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:14px;
}
.status-bar .notch .cam{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#1a1a2e 30%,#2a2a4e 70%);border:2px solid #333}
.status-bar .ri{display:flex;gap:5px;align-items:center;font-size:13px}
.status-bar .ri svg{width:16px;height:16px}

/* ═══════ 开场粒子 ═══════ */
#intro{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%,#161628,#080810);overflow:hidden;transition:opacity .8s}
#intro.out{opacity:0;pointer-events:none}
#ptc{position:absolute;inset:0}
.beam{position:absolute;left:50%;top:0;width:2px;height:100%;transform:translateX(-50%);background:linear-gradient(to bottom,transparent,rgba(186,216,240,.5)40%,rgba(240,170,196,.35)70%,transparent);box-shadow:0 0 40px 8px rgba(186,216,240,.12);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.it{position:relative;z-index:1;font-size:clamp(28px,7vw,48px);font-weight:200;letter-spacing:2px;color:rgba(255,255,255,.88);text-shadow:0 0 40px rgba(186,216,240,.35);opacity:0;animation:fu 1.8s .4s ease forwards}
.is{position:relative;z-index:1;margin-top:10px;font-size:11px;letter-spacing:6px;color:rgba(186,216,240,.4);opacity:0;animation:fu 1.4s 1.2s ease forwards}
.il{position:absolute;bottom:11%;left:50%;transform:translateX(-50%);z-index:1;font-size:11px;color:rgba(186,216,240,.3);opacity:0;animation:fu 1s 2s ease forwards}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ═══════ 信函开场 ═══════ */
#ls{position:fixed;inset:0;z-index:9998;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,#161628,#080810);overflow:hidden}
#ls.on{display:flex}#ls.out{animation:lso .8s ease forwards}
@keyframes lso{to{opacity:0;transform:scale(1.06)}}
.lst{font-size:clamp(24px,6vw,38px);font-weight:200;color:rgba(255,255,255,.85);text-shadow:0 0 28px rgba(186,216,240,.25);animation:fu .8s ease forwards}
.lss{font-size:11px;letter-spacing:5px;color:rgba(186,216,240,.35);margin:8px 0 44px;opacity:0;animation:fu 1s .3s ease forwards}
.env{position:relative;width:240px;height:155px;cursor:pointer}
.env-b{position:absolute;inset:0;background:linear-gradient(135deg,#c8dff0,#ddeaf6);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .5s var(--bounce)}
.env:active .env-b{transform:scale(.96)}
.env-b::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent 50%);pointer-events:none;border-radius:inherit}
.env-f{position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(135deg,#b8d4e8,#cce2f0);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:12px 12px 0 0;transform-origin:top;transition:transform .6s var(--ease);z-index:2}
.env.open .env-f{transform:rotateX(180deg)}
.env-seal{position:absolute;bottom:35%;left:50%;transform:translateX(-50%);width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#9ec8e0,#7aaecc);box-shadow:0 2px 14px rgba(124,174,204,.5);display:flex;align-items:center;justify-content:center;z-index:3;transition:all .4s}
.env.open .env-seal{opacity:0;transform:translateX(-50%) scale(.4)}
.env-seal svg{width:16px;height:16px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.env-lb{position:absolute;bottom:14px;right:16px;font-size:9px;color:rgba(90,140,180,.5);letter-spacing:1px;z-index:1}
.env-line{position:absolute;bottom:28px;left:20px;right:60px;height:1px;background:rgba(124,174,204,.2);z-index:1}
.env-line2{position:absolute;bottom:38px;left:20px;right:40px;height:1px;background:rgba(124,174,204,.15);z-index:1}
.env-hint{margin-top:24px;font-size:11px;color:rgba(186,216,240,.25);letter-spacing:1px;animation:fu 1s .6s ease forwards;opacity:0}
.dot{position:absolute;border-radius:50%;background:rgba(186,216,240,.25);animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.6}}

/* ═══════ 主应用 ═══════ */
#app{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;overflow:hidden;opacity:0;transition:opacity .6s}
#app.on{display:flex;opacity:1}

/* ═══════ 主屏（真iPhone风格） ═══════ */
#home{flex:1;position:relative;overflow:hidden}
.hpages{display:flex;height:100%;transition:transform .4s var(--ease);will-change:transform}
.hpage{min-width:100%;height:100%;overflow-y:auto;padding:0 20px 100px;-webkit-overflow-scrolling:touch}

/* 壁纸背景渐变 */
#home::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,#dbe9f4 0%,#eef2f7 30%,#f5eff5 60%,#f2f2f7 100%);
}

/* 页面指示点 */
.pdots{position:absolute;bottom:76px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.pdots .d{width:6px;height:6px;border-radius:50%;background:var(--txt3);opacity:.3;transition:all .3s}
.pdots .d.on{opacity:1;background:var(--txt);width:18px;border-radius:3px}

/* 时钟 */
.clk{text-align:center;padding:16px 0 0;font-size:clamp(60px,16vw,80px);font-weight:100;letter-spacing:-3px;line-height:1;color:var(--txt);font-variant-numeric:tabular-nums}
.cdate{text-align:center;font-size:14px;color:var(--txt2);margin-bottom:20px;font-weight:500}

/* ═══════ 小组件（iOS Widget 风格）═══════ */
.widget{background:var(--card);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:var(--r-l);padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px var(--shd);overflow:hidden}

/* 角色卡组件 */
.w-chara{display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .2s var(--bounce)}
.w-chara:active{transform:scale(.97)}
.w-chara .av{width:48px;height:48px;border-radius:14px;background:var(--pri-l);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.w-chara .av img{width:100%;height:100%;object-fit:cover}
.w-chara .inf{flex:1;min-width:0}
.w-chara .nm{font-size:15px;font-weight:600;margin-bottom:1px}
.w-chara .ds{font-size:12px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-chara .meta{display:flex;gap:8px;margin-top:4px;font-size:11px;color:var(--txt3)}

/* 日历组件 */
.w-cal .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.w-cal .hd .mo{font-size:14px;font-weight:700}.w-cal .hd .yr{font-size:11px;color:var(--txt2)}
.w-cal .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:1px;font-size:12px}
.w-cal .dn{color:var(--txt3);font-size:10px;font-weight:600;padding:3px 0}
.w-cal .dy{padding:4px 0;border-radius:50%;transition:background .15s;line-height:1.6}
.w-cal .dy.today{background:var(--acc);color:#fff;font-weight:700;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin:0 auto;border-radius:50%}
.w-cal .dy.empty{visibility:hidden}

/* 天气组件（装饰） */
.w-weather{display:flex;align-items:center;justify-content:space-between}
.w-weather .left{display:flex;align-items:center;gap:10px}
.w-weather .wicon{font-size:36px}
.w-weather .temp{font-size:32px;font-weight:200}
.w-weather .winfo{font-size:11px;color:var(--txt2)}

/* ═══════ APP 图标（真iOS风格）═══════ */
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;padding:8px 0;justify-items:center}
.aico{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;-webkit-tap-highlight-color:transparent;width:70px}
.aico .bx{
  width:60px;height:60px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s var(--bounce);
  position:relative;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.aico .bx::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25) 0%,transparent 50%);pointer-events:none;border-radius:inherit}
.aico:active .bx{transform:scale(.82)}
.aico .bx svg{width:26px;height:26px;position:relative;z-index:1;fill:none!important;stroke-width:1.6!important;stroke-linecap:round!important;stroke-linejoin:round!important}
/* 有色背景白线条，白色背景深色线条 */
.bx-dk svg,.bx-pk svg,.bx-bl svg,.bx-gn svg,.bx-pp svg,.bx-yl svg,.bx-og svg,.bx-rd svg{stroke:rgba(255,255,255,.95)!important}
.bx-wh svg{stroke:var(--txt)!important}
.aico .lb{font-size:11px;color:var(--txt);text-align:center;line-height:1.1;font-weight:400}

.bx-dk{background:linear-gradient(135deg,#4a5568,#2d3748)}
.bx-wh{background:#fff;border:0.5px solid rgba(0,0,0,.06)}
.bx-pk{background:linear-gradient(135deg,#f2b8cc,#e690b0)}
.bx-bl{background:linear-gradient(135deg,#8cc0e8,#60a0d0)}
.bx-gn{background:linear-gradient(135deg,#7ec8a0,#58b080)}
.bx-pp{background:linear-gradient(135deg,#b898d8,#9070c0)}
.bx-yl{background:linear-gradient(135deg,#f0d080,#e0b850)}
.bx-og{background:linear-gradient(135deg,#f0b080,#e89060)}
.bx-rd{background:linear-gradient(135deg,#e88080,#d06060)}

/* ═══════ Dock（真iOS Dock）═══════ */
.dock{position:absolute;bottom:0;left:0;right:0;z-index:50;padding:0 12px;padding-bottom:calc(6px + var(--safe-b))}
.dbar{
  display:flex;align-items:center;justify-content:space-evenly;
  height:68px;padding:0 8px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border-radius:28px;
  box-shadow:0 2px 20px rgba(0,0,0,.06);
  border:0.5px solid rgba(255,255,255,.6);
}
.dtab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:56px;height:56px;border-radius:14px;cursor:pointer;transition:transform .15s var(--bounce)}
.dtab:active{transform:scale(.82)}
.dtab svg{width:26px;height:26px;fill:none;stroke:var(--txt3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:all .2s}
.dtab span{font-size:9px;color:var(--txt3);transition:color .2s}
.dtab.on svg{stroke:var(--pri)}.dtab.on span{color:var(--pri);font-weight:600}

/* ═══════ 页面（真iOS导航风格）═══════ */
.pg{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:60;overflow:hidden;transform:translateX(100%);transition:transform .35s var(--ease)}
.pg.on{display:flex;transform:translateX(0)}
/* iOS 风格大标题头 */
.pghd{
  display:flex;align-items:center;
  padding:8px 16px;padding-top:calc(8px + var(--safe-t));
  gap:8px;flex-shrink:0;
  background:var(--bg);
  min-height:calc(44px + var(--safe-t));
}
.pghd .bk{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:var(--pri);font-weight:400;
}
.pghd .bk:active{background:var(--bg2)}
.pghd .tt{flex:1;font-size:17px;font-weight:600;text-align:center}
.pghd .acts{display:flex;gap:4px}
.pghd .acts button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--pri)}
.pghd .acts svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pgbd{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 20px}

/* ═══════ 聊天（仿iMessage/微信）═══════ */
.msgs{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch}
.msg-time-sep{text-align:center;font-size:11px;color:var(--txt3);padding:8px 0;font-weight:500}
.mr{display:flex;gap:8px;max-width:78%;animation:mi .25s var(--ease)}.mr.me{align-self:flex-end;flex-direction:row-reverse}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mr .ma{width:36px;height:36px;border-radius:50%;flex-shrink:0;overflow:hidden;background:var(--pri-l);display:flex;align-items:center;justify-content:center}
.mr .ma img{width:100%;height:100%;object-fit:cover}
.mc{display:flex;flex-direction:column;gap:1px;max-width:100%}
.mn{font-size:11px;color:var(--txt3);padding:0 4px;font-weight:500}
.mr.me .mn{text-align:right}
.mb{padding:9px 14px;border-radius:18px;font-size:15px;line-height:1.5;word-break:break-word;position:relative}
.mr:not(.me) .mb{background:#fff;border-top-left-radius:4px;box-shadow:0 0.5px 1px rgba(0,0,0,.06)}
.mr.me .mb{background:var(--bub-me);border-top-right-radius:4px}
.mt{font-size:10px;color:var(--txt3);padding:0 4px}
.mr.me .mt{text-align:right}
.thought{margin:2px 0;padding:7px 12px;background:rgba(239,170,189,.08);border-left:2px solid var(--acc-l);border-radius:0 var(--r-m) var(--r-m) 0;font-size:12px;color:var(--txt2);font-style:italic}
.typ{display:none;align-items:center;gap:4px;padding:4px 16px;font-size:11px;color:var(--txt3)}.typ.on{display:flex}
.td{width:5px;height:5px;border-radius:50%;background:var(--pri-l);animation:tb 1.4s ease-in-out infinite}.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}

/* 输入栏（iOS 风格） */
.cinp{
  display:flex;align-items:flex-end;gap:6px;
  padding:6px 10px;padding-bottom:calc(6px + var(--safe-b));
  background:var(--bg);flex-shrink:0;
  border-top:.5px solid var(--bdr);
}
.cinp .cb{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pri)}
.cinp .cb:active{opacity:.6}
.cinp .cb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cinp .wr{
  flex:1;min-height:36px;max-height:120px;
  background:#fff;border-radius:20px;padding:7px 14px;
  display:flex;align-items:center;
  border:.5px solid rgba(0,0,0,.12);
}
.cinp .wr:focus-within{border-color:var(--pri)}
.cinp .wr textarea{flex:1;border:none;outline:none;background:none;resize:none;font-size:15px;line-height:1.4;color:var(--txt);max-height:100px}
.cinp .wr textarea::placeholder{color:var(--txt3)}
.cinp .sb{width:30px;height:30px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;box-shadow:0 1px 4px rgba(124,184,223,.3)}
.cinp .sb:active{transform:scale(.88)}
.cinp .sb svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* 长按菜单（iOS 风格） */
.ctx-menu{position:fixed;z-index:300;background:rgba(255,255,255,.95);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.12);padding:4px 0;min-width:160px;display:none;animation:ctxIn .2s var(--ease);overflow:hidden}
.ctx-menu.on{display:block}
@keyframes ctxIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.ctx-item{padding:11px 16px;font-size:14px;display:flex;align-items:center;justify-content:space-between;transition:background .08s;cursor:pointer}
.ctx-item:active{background:rgba(0,0,0,.04)}
.ctx-item+.ctx-item{border-top:.5px solid var(--bdr)}
.ctx-item svg{width:18px;height:18px;fill:none;stroke:var(--txt2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ═══════ iOS 设置列表 ═══════ */
.sg{margin-bottom:24px}
.sg-t{font-size:13px;color:var(--txt2);padding:0 16px 6px;font-weight:400;text-transform:uppercase}
.si{background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;transition:background .08s}
.si+.si{border-top:.5px solid var(--bdr)}
.si:first-of-type{border-radius:var(--r-m) var(--r-m) 0 0}.si:last-of-type{border-radius:0 0 var(--r-m) var(--r-m)}.si:only-of-type{border-radius:var(--r-m)}
.si:active{background:rgba(0,0,0,.03)}
.si .l{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.si .l .ic{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.si .l .ic svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.si .l .lb{font-size:15px}
.si .r{color:var(--txt3);font-size:14px;display:flex;align-items:center;gap:2px}
.si .arrow{color:var(--txt3);font-size:16px}

/* iOS 开关 */
.tog{width:51px;height:31px;border-radius:16px;background:#e9e9eb;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0}
.tog.on{background:#34c759}
.tog .kn{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .3s var(--ease)}
.tog.on .kn{transform:translateX(20px)}

/* ═══════ 模态（iOS Sheet）═══════ */
.mo{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.mo.on{display:flex;opacity:1}
.mosh{background:var(--bg);width:100%;max-width:500px;max-height:92vh;border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s var(--ease);overflow:hidden}
.mo.on .mosh{transform:translateY(0)}
.mohn{width:36px;height:5px;border-radius:3px;background:var(--bg2);margin:8px auto;flex-shrink:0}
.mott{padding:4px 20px 12px;font-size:17px;font-weight:600;text-align:center}
.mobd{flex:1;overflow-y:auto;padding:0 20px 30px;-webkit-overflow-scrolling:touch}

/* 表单 iOS 风格 */
.fl{font-size:13px;color:var(--txt2);margin-bottom:4px;display:block}
.fi{width:100%;padding:11px 14px;border:.5px solid rgba(0,0,0,.12);border-radius:var(--r-m);font-size:15px;color:var(--txt);background:#fff;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--pri)}
textarea.fi{resize:vertical;min-height:70px;line-height:1.5}
.fb{width:100%;padding:14px;border-radius:var(--r-m);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.fb-p{background:var(--pri);color:#fff}.fb-p:active{opacity:.8;transform:scale(.98)}
.fb-s{background:rgba(0,0,0,.04);color:var(--txt)}.fb-d{background:#ff3b30;color:#fff}
.cse{width:100%;min-height:180px;font-family:var(--mono);font-size:12px;line-height:1.6;padding:12px;background:#1c1c1e;color:#ffd60a;border-radius:var(--r-m);border:none;outline:none;resize:vertical}

/* Toast */
.toast{position:fixed;top:calc(var(--safe-t) + 50px);left:50%;transform:translateX(-50%) translateY(-18px);z-index:9999;padding:12px 20px;border-radius:14px;background:rgba(0,0,0,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:14px;font-weight:500;opacity:0;transition:all .3s var(--ease);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 状态卡 */
.status-card{background:#fff;border-radius:var(--r-l);overflow:hidden;margin-bottom:16px}
.status-banner{height:100px;background:linear-gradient(135deg,var(--pri-l),var(--acc-l));position:relative}
.status-banner .s-av{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:absolute;bottom:-28px;left:16px;box-shadow:0 2px 8px var(--shd)}
.status-banner .s-av img{width:100%;height:100%;object-fit:cover}
.status-body{padding:36px 16px 16px}
.status-name{font-size:18px;font-weight:700}.status-mood{font-size:13px;color:var(--txt2);margin-top:2px;margin-bottom:10px}
.status-section{margin-top:12px}
.status-label{font-size:11px;color:var(--txt3);letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;font-weight:600}
.status-tags{display:flex;flex-wrap:wrap;gap:6px}
.status-tag{padding:4px 12px;border-radius:20px;background:var(--bg);font-size:12px;color:var(--txt2)}
.sbar-fill{height:4px;border-radius:2px;background:var(--bg2);overflow:hidden;margin-top:4px}
.sbar-fill .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--pri-l),var(--pri))}

/* 情侣空间 */
.couple-header{text-align:center;padding:20px;background:#fff;border-radius:var(--r-l);margin-bottom:16px}
.couple-avatars{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.couple-avatars .c-av{width:56px;height:56px;border-radius:50%;background:var(--pri-l);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 8px var(--shd)}
.couple-avatars .c-av img{width:100%;height:100%;object-fit:cover}
.couple-avatars .c-heart{font-size:18px;color:var(--acc);animation:hb 1.5s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.couple-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.couple-cell{background:#fff;border-radius:var(--r-m);padding:16px 8px;text-align:center;cursor:pointer;transition:transform .15s}
.couple-cell:active{transform:scale(.95)}
.couple-cell .c-nm{font-size:12px;color:var(--txt2);margin-top:4px}

/* 游戏列表 */
.game-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.game-card{background:#fff;border-radius:var(--r-l);padding:16px;cursor:pointer;transition:transform .15s}
.game-card:active{transform:scale(.96)}
.game-card .g-nm{font-size:15px;font-weight:600;margin-bottom:2px}.game-card .g-ds{font-size:12px;color:var(--txt3);line-height:1.3}

/* 房间 */
.room-item{background:#fff;border-radius:var(--r-m);padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .12s}
.room-item:active{transform:scale(.98)}
.room-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.room-icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.room-info{flex:1}.room-nm{font-size:14px;font-weight:600}.room-ds{font-size:12px;color:var(--txt3)}

/* 朋友圈 */
.moment-item{background:#fff;border-radius:var(--r-l);padding:14px 16px;margin-bottom:10px}
.moment-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.moment-av{width:38px;height:38px;border-radius:50%;background:var(--pri-l);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.moment-av img{width:100%;height:100%;object-fit:cover}
.moment-nm{font-size:14px;font-weight:600}.moment-time{font-size:11px;color:var(--txt3)}
.moment-txt{font-size:14px;line-height:1.6;margin-bottom:8px}
.moment-acts{display:flex;gap:16px;padding-top:8px;border-top:.5px solid var(--bdr)}
.moment-act{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--txt3);cursor:pointer}
.moment-act svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}

/* 收藏 */
.fav-item{display:flex;gap:10px;padding:12px;background:#fff;border-radius:var(--r-m);margin-bottom:8px}
.fav-icon{width:34px;height:34px;border-radius:10px;background:var(--pri-l);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fav-icon svg{width:16px;height:16px;fill:none;stroke:var(--pri-d);stroke-width:1.5}
.fav-info{flex:1;min-width:0}.fav-txt{font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.fav-meta{font-size:10px;color:var(--txt3);margin-top:3px}

/* 表情 */
.emo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.emo-cell{aspect-ratio:1;border-radius:var(--r-s);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-size:28px;transition:transform .12s}
.emo-cell:active{transform:scale(.88)}.emo-cell img{width:100%;height:100%;object-fit:contain}
.emo-cell.add{border:1.5px dashed var(--txt3);font-size:24px;color:var(--txt3);background:transparent}

/* 查手机 */
.phone-notif{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.phone-notif .n-icon{width:30px;height:30px;border-radius:8px;background:var(--pri-l);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.phone-notif .n-icon svg{width:14px;height:14px;fill:none;stroke:var(--pri-d);stroke-width:1.5}
.phone-notif .n-info{flex:1}.phone-notif .n-app{font-size:11px;color:var(--txt3);font-weight:600}.phone-notif .n-text{font-size:13px}
.phone-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 0;justify-items:center}
.phone-app{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:60px}
.phone-app .pa-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.phone-app .pa-icon::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 50%);border-radius:inherit;pointer-events:none}
.phone-app:active .pa-icon{transform:scale(.82)}
.phone-app .pa-icon svg{width:22px;height:22px;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.phone-app .pa-icon:not(.pw) svg{stroke:rgba(255,255,255,.95)}
.phone-app .pa-icon.pw svg{stroke:var(--txt)}
.phone-app span{font-size:10px;color:var(--txt2)}

/* Levi猫猫 */
.levi{position:fixed;bottom:calc(84px + var(--safe-b));right:16px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:90;transition:transform .2s var(--bounce)}
.levi:active{transform:scale(.85)}
.levi svg{width:22px;height:22px;fill:none;stroke:var(--pri);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

#ccss{}
</style>

const DB={db:null,init(){return new Promise((ok,no)=>{const r=indexedDB.open('LeviMeow',6);r.onupgradeneeded=e=>{const d=e.target.result;['kv','worldbook','regex'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,n==='kv'?undefined:{keyPath:'id',autoIncrement:true})});if(!d.objectStoreNames.contains('messages')){const s=d.createObjectStore('messages',{keyPath:'id',autoIncrement:true});s.createIndex('chatId','chatId')}['favorites','moments','groups','emojis','diary'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id',autoIncrement:true})})};r.onsuccess=e=>{DB.db=e.target.result;ok()};r.onerror=no})},tx(s,m){return DB.db.transaction(s,m).objectStore(s)},get(s,k){return new Promise(r=>{const q=DB.tx(s,'readonly').get(k);q.onsuccess=()=>r(q.result)})},put(s,v,k){return new Promise(r=>{const q=k!==undefined?DB.tx(s,'readwrite').put(v,k):DB.tx(s,'readwrite').put(v);q.onsuccess=()=>r(q.result)})},all(s){return new Promise(r=>{const q=DB.tx(s,'readonly').getAll();q.onsuccess=()=>r(q.result)})},del(s,k){return new Promise(r=>{const q=DB.tx(s,'readwrite').delete(k);q.onsuccess=r})},clr(s){return new Promise(r=>{const q=DB.tx(s,'readwrite').clear();q.onsuccess=r})},idx(s,i,v){return new Promise(r=>{const q=DB.tx(s,'readonly').index(i).getAll(v);q.onsuccess=()=>r(q.result)})}};

<div class="sg"><div class="sg-t">数据</div><div class="si" onclick="A.expD()"><div class="l">${mk('var(--pri)',I.up)}<span class="lb">导出</span></div><div class="r"><span class="arrow">›</span></div></div><div class="si" onclick="A.impD()"><div class="l">${mk('var(--pri)',I.down)}<span class="lb">导入</span></div><div class="r"><span class="arrow">›</span></div></div><div class="si" onclick="if(confirm('确定清空？'))A.clrAll()"><div class="l">${mk('#ff3b30',I.trash)}<span class="lb" style="color:#ff3b30">清空所有</span></div><div class="r"><span class="arrow">›</span></div></div></div>
<div style="text-align:center;padding:20px;font-size:12px;color:var(--txt3)">Levi喵喵日记 v0.4.0</div>`},
openApi(){const c=A.S.api||{};A.modal('API配置',`<div style="display:flex;flex-direction:column;gap:12px"><select class="fi" id="ap-p"><option value="openai"${c.provider==='openai'?' selected':''}>OpenAI兼容</option><option value="claude"${c.provider==='claude'?' selected':''}>Claude</option><option value="gemini"${c.provider==='gemini'?' selected':''}>Gemini</option></select><div><label class="fl">Endpoint</label><input class="fi" id="ap-e" value="${c.endpoint||''}"></div><div><label class="fl">Key</label><input class="fi" id="ap-k" type="password" value="${c.key||''}"></div><div><label class="fl">模型</label><input class="fi" id="ap-m" value="${c.model||''}"></div><div><label class="fl">Temperature</label><input class="fi" id="ap-t" type="number" min="0" max="2" step=".1" value="${c.temp??.9}"></div><div><label class="fl">MaxTokens</label><input class="fi" id="ap-tk" type="number" value="${c.maxTk||4096}"></div><div><label class="fl">额外Headers</label><textarea class="fi" id="ap-h" rows="2">${c.headers||''}</textarea></div><div><label class="fl">额外Body</label><textarea class="fi" id="ap-x" rows="2">${c.extra||''}</textarea></div><button class="fb fb-p" onclick="A.saveApi()">保存</button><button class="fb fb-s" onclick="A.testApi()">测试连接</button></div>`)},
async saveApi(){A.S.api={provider:$('#ap-p').value,endpoint:$('#ap-e').value.replace(/\/+$/,''),key:$('#ap-k').value,model:$('#ap-m').value,temp:+$('#ap-t').value,maxTk:+$('#ap-tk').value,headers:$('#ap-h').value,extra:$('#ap-x').value};await DB.put('kv',A.S.api,'api');A.toast('✅');A.closeMo();A.rSet()},
async testApi(){A.toast('测试中…');const r=await AI.chat([{role:'system',content:'打招呼'},{role:'user',content:'你好'}],null);if(r)A.toast('✅ '+r.slice(0,30))},
async togNsfw(){A.S.nsfw=!A.S.nsfw;await DB.put('kv',A.S.nsfw,'nsfw');$('#ntog')?.classList.toggle('on',A.S.nsfw);A.toast(A.S.nsfw?'🔓 已解锁':'🔒 已关闭')},
openChar(){const c=A.S.char||{};A.modal('人格档案',`<div style="display:flex;flex-direction:column;gap:12px"><div style="text-align:center"><div style="width:72px;height:72px;border-radius:50%;background:var(--pri-l);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px var(--shd)" onclick="$('#avup').click()">${c.avatar?`<img src="${c.avatar}" style="width:100%;height:100%;object-fit:cover">`:'🐱'}</div><input type="file" id="avup" accept="image/*" style="display:none" onchange="A.upAv(this)"><div style="font-size:11px;color:var(--txt3)">点击上传</div></div><input class="fi" id="ch-n" value="${c.name||''}" placeholder="名字"><input class="fi" id="ch-d" value="${c.desc||''}" placeholder="简介"><textarea class="fi" id="ch-p" rows="6" placeholder="人设">${c.persona||''}</textarea><textarea class="fi" id="ch-s" rows="4" placeholder="系统提示词（可留空）">${c.sys||''}</textarea><button class="fb fb-p" onclick="A.saveCh()">保存</button>${c.id?'<button class="fb fb-d" onclick="if(confirm(\'确定？\'))A.delCh()">删除</button>':''}</div>`)},
upAv(inp){const f=inp.files[0];if(!f)return;const r=new FileReader;r.onload=e=>{A._av=e.target.result;inp.parentElement.querySelector('div').innerHTML=`<img src="${A._av}" style="width:100%;height:100%;object-fit:cover">`};r.readAsDataURL(f)},
async saveCh(){const n=$('#ch-n').value.trim();if(!n)return A.toast('请输入名字');const c=A.S.char||{id:'c_'+Date.now(),at:Date.now()};c.name=n;c.desc=$('#ch-d').value.trim();c.persona=$('#ch-p').value.trim();c.sys=$('#ch-s').value.trim();if(A._av){c.avatar=A._av;A._av=null}A.S.char=c;await DB.put('kv',c,'char');A.rCard();A.toast('✅');A.closeMo();A.rSet()},
async delCh(){A.S.char=null;await DB.put('kv',null,'char');A.hist=[];await DB.clr('messages');A.rCard();A.toast('已删除');A.closeMo();A.rSet()},
async openWb(){const es=await DB.all('worldbook');A.modal('世界书',`<button class="fb fb-p" style="margin-bottom:12px" onclick="A.editWb()">＋ 新建</button>${!es.length?'<div style="text-align:center;color:var(--txt3);padding:20px">还没有条目</div>':''}${es.map(e=>`<div class="si" onclick="A.editWb(${e.id})"><div class="l"><span class="lb">${esc((e.kw||[]).join(',')||'常驻')}</span></div><span class="arrow">›</span></div>`).join('')}`)},
async editWb(id){let e=id?await DB.get('worldbook',id):null;if(!e)e={kw:[],content:'',always:false,off:false};A.modal(id?'编辑':'新建',`<div style="display:flex;flex-direction:column;gap:12px"><input class="fi" id="wk" value="${(e.kw||[]).join(', ')}" placeholder="关键词"><textarea class="fi" id="wc" rows="6">${e.content||''}</textarea><label style="font-size:13px"><input type="checkbox" id="wa"${e.always?' checked':''}> 常驻</label><label style="font-size:13px"><input type="checkbox" id="wo"${e.off?' checked':''}> 暂停</label><button class="fb fb-p" onclick="A.saveWb(${id||'null'})">保存</button>${id?`<button class="fb fb-d" onclick="A.delWb(${id})">删除</button>`:''}<button class="fb fb-s" onclick="A.openWb()">‹ 返回</button></div>`)},
async saveWb(id){const kw=$('#wk').value?$('#wk').value.split(',').map(s=>s.trim()).filter(Boolean):[];const o={kw,content:$('#wc').value,always:$('#wa').checked,off:$('#wo').checked};if(id)o.id=id;await DB.put('worldbook',o);A.toast('✅');A.openWb()},
async delWb(id){await DB.del('worldbook',id);A.openWb()},
async openRx(){const rs=await DB.all('regex');A.modal('正则',`<button class="fb fb-p" style="margin-bottom:12px" onclick="A.editRx()">＋ 新建</button>${!rs.length?'<div style="text-align:center;color:var(--txt3);padding:20px">还没有规则</div>':''}${rs.map(r=>`<div class="si" onclick="A.editRx(${r.id})"><div class="l"><span class="lb" style="font-family:var(--mono);font-size:12px">${esc((r.pat||'').slice(0,25))}</span></div>›</div>`).join('')}`)},
async editRx(id){let r=id?await DB.get('regex',id):null;if(!r)r={pat:'',rep:'',dir:'display',flags:'gi',off:false};A.modal(id?'编辑':'新建',`<div style="display:flex;flex-direction:column;gap:12px"><select class="fi" id="rd"><option value="input"${r.dir==='input'?' selected':''}>输入</option><option value="output"${r.dir==='output'?' selected':''}>输出</option><option value="display"${r.dir==='display'?' selected':''}>仅显示</option><option value="both"${r.dir==='both'?' selected':''}>全部</option></select><input class="fi" id="rp" value="${esc(r.pat)}" placeholder="查找" style="font-family:var(--mono)"><input class="fi" id="rf" value="${r.flags||'gi'}" placeholder="标志" style="width:70px"><textarea class="fi" id="rr" rows="3" placeholder="替换为" style="font-family:var(--mono)">${esc(r.rep)}</textarea><label style="font-size:13px"><input type="checkbox" id="ro"${r.off?' checked':''}> 暂停</label><div style="padding:8px;background:var(--bg2);border-radius:var(--r-m)"><input class="fi" id="rti" placeholder="测试" oninput="A.trx()"><div id="rto" style="font-size:12px;margin-top:4px;min-height:16px"></div></div><button class="fb fb-p" onclick="A.saveRx(${id||'null'})">保存</button>${id?`<button class="fb fb-d" onclick="A.delRx(${id})">删除</button>`:''}<button class="fb fb-s" onclick="A.openRx()">‹ 返回</button></div>`)},
trx(){const p=$('#rp').value,f=$('#rf').value,r=$('#rr').value,i=$('#rti').value,o=$('#rto');if(!p||!i)return o.textContent='';try{o.textContent='→ '+i.replace(new RegExp(p,f),r);o.style.color='var(--pri-d)'}catch(e){o.textContent='❌ '+e.message;o.style.color='#ff3b30'}},
async saveRx(id){const o={pat:$('#rp').value,flags:$('#rf').value||'gi',rep:$('#rr').value,dir:$('#rd').value,off:$('#ro').checked};if(id)o.id=id;await DB.put('regex',o);A.toast('✅');A.openRx()},
async delRx(id){await DB.del('regex',id);A.openRx()},
openTheme(){A.modal('主题',`<div style="display:flex;flex-direction:column;gap:14px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[{n:'水色',k:'water',c:['#f2f2f7','#7cb8df','#efaabd']},{n:'樱粉',k:'sakura',c:['#fce8f0','#e090b0','#d070a0']},{n:'薄荷',k:'mint',c:['#e8fef0','#60b888','#48a870']},{n:'薰衣草',k:'lav',c:['#f0e8fe','#9070c0','#c8a0f0']},{n:'暖阳',k:'warm',c:['#fef8e8','#d09048','#e0a860']},{n:'深夜',k:'night',c:['#1c1c1e','#5a9bc7','#efaabd']}].map(t=>`<div style="padding:12px 6px;border-radius:12px;background:#fff;text-align:center;cursor:pointer" onclick="A.preT('${t.k}')"><div style="display:flex;gap:3px;justify-content:center;margin-bottom:5px">${t.c.map(c=>`<div style="width:14px;height:14px;border-radius:50%;background:${c}"></div>`).join('')}</div><div style="font-size:12px">${t.n}</div></div>`).join('')}</div><textarea class="cse" id="cse" rows="10" spellcheck="false">${A.S.css}</textarea><div style="display:flex;gap:8px"><button class="fb fb-p" style="flex:1" onclick="A.apCSS()">应用</button><button class="fb fb-s" style="flex:1" onclick="A.rsCSS()">重置</button></div></div>`)},
preT(k){const T={water:':root{--bg:#f2f2f7;--bg2:#e5e5ea;--pri:#7cb8df;--pri-l:#bad8f0;--acc:#efaabd;--txt:#1c1c1e;--bub-me:linear-gradient(135deg,#bad8f0,#d0e8fa)}',sakura:':root{--bg:#fce8f0;--bg2:#f8d0e0;--pri:#e090b0;--pri-l:#f0b8d0;--acc:#d070a0;--txt:#5c3a4a;--bub-me:linear-gradient(135deg,#f8c8d8,#fcdce8)}',mint:':root{--bg:#e8fef0;--bg2:#c8f0d8;--pri:#60b888;--pri-l:#a0d8b8;--acc:#48a870;--txt:#2a4a3a;--bub-me:linear-gradient(135deg,#a0d8b8,#c8f0d8)}',lav:':root{--bg:#f0e8fe;--bg2:#e0d0f8;--pri:#9070c0;--pri-l:#b898e0;--acc:#c8a0f0;--txt:#3a2a5c;--bub-me:linear-gradient(135deg,#c8b0e8,#e0d0f8)}',warm:':root{--bg:#fef8e8;--bg2:#f8ecd0;--pri:#d09048;--pri-l:#f0c880;--acc:#e0a860;--txt:#5c4a2a;--bub-me:linear-gradient(135deg,#f0d8a0,#f8ecd0)}',night:':root{--bg:#1c1c1e;--bg2:#2c2c2e;--card:rgba(44,44,46,.9);--card-s:#2c2c2e;--pri:#5a9bc7;--pri-l:#3a6888;--acc:#efaabd;--txt:#f5f5f7;--txt2:#98989d;--txt3:#636366;--bdr:rgba(84,84,88,.3);--shd:rgba(0,0,0,.3);--bub-me:linear-gradient(135deg,#2a3a5e,#3a4a6e);--bub-ta:#2c2c2e}'};if(T[k]){A.S.css=T[k];$('#ccss').textContent=T[k];const e=$('#cse');if(e)e.value=T[k];DB.put('kv',T[k],'css');A.toast('✅ 已切换')}},
apCSS(){const v=$('#cse').value;A.S.css=v;$('#ccss').textContent=v;DB.put('kv',v,'css');A.toast('✅')},
rsCSS(){A.S.css='';$('#ccss').textContent='';const e=$('#cse');if(e)e.value='';DB.put('kv','','css');A.toast('已重置')},
async expD(){const d={v:'0.4',api:A.S.api,char:A.S.char,nsfw:A.S.nsfw,css:A.S.css,msgs:await DB.all('messages'),wb:await DB.all('worldbook'),rx:await DB.all('regex'),moments:await DB.all('moments'),groups:await DB.all('groups'),favs:await DB.all('favorites'),emoji:await DB.all('emojis'),diary:await DB.all('diary'),rooms:await DB.get('kv','rooms')};const b=new Blob([JSON.stringify(d)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Levi_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);A.toast('📤 已导出')},
impD(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.api){A.S.api=d.api;await DB.put('kv',d.api,'api')}if(d.char){A.S.char=d.char;await DB.put('kv',d.char,'char')}if(d.nsfw!==undefined){A.S.nsfw=d.nsfw;await DB.put('kv',d.nsfw,'nsfw')}if(d.css){A.S.css=d.css;await DB.put('kv',d.css,'css');$('#ccss').textContent=d.css}if(d.rooms)await DB.put('kv',d.rooms,'rooms');const ss={msgs:'messages',wb:'worldbook',rx:'regex',moments:'moments',groups:'groups',favs:'favorites',emoji:'emojis',diary:'diary'};for(const[k,s]of Object.entries(ss))if(d[k])for(const item of d[k])await DB.put(s,item);if(A.S.char)A.hist=(await DB.idx('messages','chatId',A.S.char.id)).sort((a,b)=>a.id-b.id);A.rCard();A.rSet();A.toast('✅')}catch(e){A.toast('❌ '+e.message)}};inp.click()},
async clrAll(){for(const s of['kv','messages','worldbook','regex','favorites','moments','groups','emojis','diary'])await DB.clr(s);A.S={api:null,char:null,nsfw:false,css:''};A.hist=[];$('#ccss').textContent='';A.rCard();A.rSet();A.toast('已清空')},
leviChat(){A.toast('🐱 Levi猫猫来啦～有什么需要帮忙的喵？')},
modal(t,h){$('#mott').textContent=t;$('#mobd').innerHTML=h;$('#mo').classList.add('on')},
closeMo(){$('#mo').classList.remove('on')},
toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(A._tt);A._tt=setTimeout(()=>e.classList.remove('on'),2400)},_tt:null,
};
window.addEventListener('DOMContentLoaded',()=>A.init());
document.addEventListener('click',()=>$('#ctx').classList.remove('on'));
</script>
</body>
</html>
